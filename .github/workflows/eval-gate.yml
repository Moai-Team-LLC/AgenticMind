name: eval-gate

# CI eval-regression gate (Agentic Product Standard v2.0, DoD 12): the live
# pass-rate run of the integration eval (lib/eval against the real engine).
# `scripts/eval.ts` exits non-zero when the pass rate drops below
# BASELINE_PASS_RATE, or when a failure mode falls under its floor in
# BASELINE_MODE_FLOORS — that non-zero is the gate. Floors exist because the
# overall rate hides a small mode: the first live run (2026-10-26) was 229/234
# overall with faithfulness at 2/5, and passed. The log ends with the run's
# token usage per model and a `Usage: … tokens` total (≈ $ at list prices).
#
# Cost-aware: it makes real chat-model calls, so it runs weekly + on demand,
# not on every PR. Without a CHAT_API_KEY secret it cannot evaluate anything, and
# that is reported as such: the run is marked SKIPPED in the job summary and
# FAILS — a skipped gate is not a passed one. (Until 0.14.1 it skipped cleanly
# and showed green every week.) Add CHAT_API_KEY (and optionally a CHAT_BASE_URL
# repo variable) in Settings → Secrets to enable it.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these failure modes (comma-separated, e.g. faithfulness); empty = full suite. Floors of modes not listed are skipped"
        default: ""
      baseline:
        description: "Minimum pass rate (0..1)"
        default: "0.8"
      mode_floors:
        description: 'Per-failure-mode minimum pass rates, JSON ({} = none)'
        default: '{"faithfulness":0.8}'
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    # A real run is ~360 model calls (minutes). Without a bound, a provider that
    # hangs or keeps failing keeps the job "running" for GitHub's 6-hour limit.
    timeout-minutes: 90
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: agenticmind
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:mysecretpassword@localhost:5432/agenticmind
      SKIP_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Gate on CHAT_API_KEY secret
        id: gate
        env:
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
        run: |
          if [ -n "$CHAT_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "eval-gate: RUNNING the live eval"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### eval-gate: SKIPPED — nothing was evaluated"
              echo "The CHAT_API_KEY secret is not set. A skipped gate is not a pass,"
              echo "so this run fails. Set the secret to enable the live eval."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::eval-gate SKIPPED — CHAT_API_KEY is not set, nothing was evaluated (a skip is not a pass)."
            exit 1
          fi

      # A key the provider rejects would make every model call retry for up to a
      # minute (packages/shared/src/lib/retry.ts): ~360 calls, hours of "running"
      # with nothing measured. GET /models spends no tokens, so check the key first
      # and report "could not measure" apart from a quality regression. (Providers
      # whose /models is public cannot be checked this way; the job timeout still
      # bounds the run.)
      - name: Preflight the chat key (free — no tokens)
        if: steps.gate.outputs.enabled == 'true'
        env:
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
          CHAT_BASE_URL: ${{ vars.CHAT_BASE_URL || 'https://api.openai.com/v1' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $CHAT_API_KEY" "${CHAT_BASE_URL%/}/models") || true
          code=${code:-000}
          case "$code" in
            200)
              echo "eval-gate: the provider accepts CHAT_API_KEY (HTTP 200)"
              ;;
            401|403)
              echo "### eval-gate: NOT RUN — the provider rejected CHAT_API_KEY (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::eval-gate NOT RUN — the provider rejected CHAT_API_KEY (HTTP $code); nothing was evaluated."
              exit 1
              ;;
            *)
              echo "### eval-gate: NOT RUN — could not reach the provider (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::eval-gate NOT RUN — could not reach $CHAT_BASE_URL (HTTP $code); nothing was evaluated."
              exit 1
              ;;
          esac

      - name: Initialize DB extensions
        if: steps.gate.outputs.enabled == 'true'
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d agenticmind < scripts/db-init/00-extensions.sql

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.enabled == 'true'

      - name: Run migrations
        if: steps.gate.outputs.enabled == 'true'
        run: bun run db:migrate

      - name: Seed the eval corpus
        if: steps.gate.outputs.enabled == 'true'
        run: bunx tsx scripts/seed-eval-corpus.ts

      - name: Run the eval (non-zero exit on regression = the gate)
        id: eval
        if: steps.gate.outputs.enabled == 'true'
        env:
          # A manual run may be restricted to some failure modes (a cents-sized check);
          # the weekly schedule has no inputs, so it always runs the full suite.
          EVAL_ONLY: ${{ github.event.inputs.only }}
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
          CHAT_BASE_URL: ${{ vars.CHAT_BASE_URL || 'https://api.openai.com/v1' }}
          BASELINE_PASS_RATE: ${{ github.event.inputs.baseline || '0.8' }}
          BASELINE_MODE_FLOORS: ${{ github.event.inputs.mode_floors || '{"faithfulness":0.8}' }}
        run: bunx tsx scripts/eval.ts

      - name: Report the gate outcome
        if: always() && steps.gate.outputs.enabled == 'true'
        run: |
          echo "### eval-gate: RAN — result: ${{ steps.eval.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "eval-gate: RAN — result: ${{ steps.eval.outcome }}"
