name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Canonical gate: Bun (frozen lockfile), the reproducible build.
  check-bun:
    name: check (bun)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: agenticmind
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Initialize DB extensions
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d agenticmind < scripts/db-init/00-extensions.sql
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # Fails on an advisory in a package the server or worker actually imports
      # (bun audit alone is red on dev tooling and stops meaning anything).
      - name: Reachable-advisory gate
        run: bun run audit:reachable
      - name: Run migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://postgres:mysecretpassword@localhost:5432/agenticmind
      # The strict compose overlay's provisioning SQL, exactly as Compose hands it
      # to the container (Compose interpolates `$`, so `DO $$` is written `$$$$`),
      # run against the migrated database: the role must come out as a LOGIN,
      # non-superuser, non-BYPASSRLS member of agenticmind_app.
      - name: Strict compose overlay provisions the app role
        run: |
          set -euo pipefail
          cat > /tmp/probe.yml <<'YAML'
          services:
            probe:
              image: timescale/timescaledb-ha:pg17
              entrypoint: ["cat", "/provision.sql"]
              configs:
                - source: agenticmind-app-role-sql
                  target: /provision.sql
          YAML
          AGENTICMIND_DB_PASSWORD=ci AGENTICMIND_APP_DB_PASSWORD=ci MCP_API_KEY=ci_dummy_key_0123456789abcdef OPENAI_API_KEY=ci \
            docker compose -p amprobe -f deploy/docker-compose.yml -f deploy/docker-compose.strict.yml -f /tmp/probe.yml \
            run --rm --no-deps -T probe < /dev/null > /tmp/provision.sql
          test -s /tmp/provision.sql
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d agenticmind -v ON_ERROR_STOP=1 -v app_password=ci_probe < /tmp/provision.sql
          role=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -d agenticmind -Atc "select rolcanlogin::text || rolsuper::text || rolbypassrls::text || pg_has_role('agenticmind_server', 'agenticmind_app', 'member')::text from pg_roles where rolname = 'agenticmind_server'")
          echo "agenticmind_server (login, super, bypassrls, member): $role"
          test "$role" = "truefalsefalsetrue"
      - name: Typecheck
        run: bun run tsc
      - name: Lint (check-only, no autofix)
        run: bun run lint:ci
      - name: Unit tests (incl. eval harness, guardrails, judge calibration)
        run: bun test
        env:
          DATABASE_URL: postgres://postgres:mysecretpassword@localhost:5432/agenticmind
      # Full integration eval (lib/eval against the live engine) runs where
      # DATABASE_URL + CHAT_API_KEY are available:
      #   bun run eval   # exits non-zero on regression vs BASELINE_PASS_RATE

  # Compatibility canary: dependencies install under plain npm (bun.lock is
  # canonical and not committed for npm, so this resolves fresh; .npmrc supplies
  # legacy-peer-deps). Bun is installed only so Turbo (packageManager: bun) can
  # orchestrate the workspace tasks; the server/worker themselves run on Node via
  # tsx, and dependency resolution is what this job proves.
  check-npm:
    name: check (npm / Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: npm install
      - name: Typecheck
        run: npm run tsc
      - name: Unit tests
        run: npm run test
